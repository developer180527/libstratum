[package]
name = "libstratum"
description = "Low-level observability for native binaries: what did this source become? (facade crate)"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["elf", "macho", "pe", "dwarf", "pdb", "cpp"]
elf = ["dep:libstratum-format-elf"]
macho = ["dep:libstratum-format-macho"]
pe = ["dep:libstratum-format-pe"]
dwarf = ["dep:libstratum-debug-dwarf"]
pdb = ["dep:libstratum-debug-pdb"]
cpp = ["dep:libstratum-lang-cpp", "dep:libstratum-demangle"]
# Memory-map input files instead of reading them. Faster for very large binaries, but a file
# rewritten while mapped (e.g. by a rebuild) can crash the host process with SIGBUS (ADR-0021).
mmap = ["dep:memmap2"]

[dependencies]
libstratum-core.workspace = true
libstratum-model.workspace = true
libstratum-format-elf = { workspace = true, optional = true }
libstratum-format-macho = { workspace = true, optional = true }
libstratum-format-pe = { workspace = true, optional = true }
libstratum-debug-dwarf = { workspace = true, optional = true }
libstratum-debug-pdb = { workspace = true, optional = true }
libstratum-lang-cpp = { workspace = true, optional = true }
libstratum-demangle = { workspace = true, optional = true }
# Archive member extraction for Mach-O debug-map objects (`lib.a(member.o)`).
object.workspace = true
memmap2 = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
