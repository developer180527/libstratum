name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Tier 1 host platforms (ADR-0019). Windows is required for MSVC fixtures from M0.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p libstratum --features mmap
      - run: python3 scripts/check_dependency_rules.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.88 --profile minimal
      # `+1.88` overrides rust-toolchain.toml for this check.
      - run: cargo +1.88 check --workspace
