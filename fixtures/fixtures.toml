# Fixture corpus manifest (docs/06-testing.md).
# Each fixture is built for every toolchain/arch/opt combination in its group's matrix.

[groups.layout]
# M2 abstraction proof: every layout fixture must exist on all Tier 1 platforms.
opts = ["O0", "O2"]
toolchains = ["apple-clang", "linux-clang", "linux-gcc", "arm-none-eabi-gcc", "arm-llvm", "riscv-gcc", "msvc", "clang-cl", "linux-clang-types5", "linux-clang-types4"]

